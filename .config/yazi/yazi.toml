[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
sort_translit = false
linemode = "size"
show_hidden = true
show_symlink = true
scrolloff = 5
mouse = true
title_format = "Yazi: {cwd}"

[preview]
wrap = "no"
tab_size = 2
max_width = 1000
max_height = 1200
cache_dir = ""


# Custom Open With applications
[opener]
edit = [
    { run = 'nvim %s', desc = "Neovim", block = true, for = "unix" },
]
play = [
    { run = 'mpv %s', desc = "MPV", orphan = true, for = "unix" },
]
pdf = [
    { run = 'zathura %s', desc = "Zathura PDF", orphan = true, for = "unix" },
]
open = [
    { run = 'xdg-open %s1', desc = "Default application", orphan = true, for = "unix" },
]
image = [
    { run = 'feh %s', desc = "Feh Image Viewer", orphan = true, for = "unix" },
]

[open]
prepend_rules = [
    { url = "*.pdf", use = ["pdf", "open", "edit"] },
    { url = "*.mp4", use = ["play", "open"] },
    { url = "*.mkv", use = ["play", "open"] },
    { url = "*.webm", use = ["play", "open"] },
    { url = "*.py", use = ["edit", "open"] },
    { url = "*.js", use = ["edit", "open"] },
    { url = "*.json", use = ["edit", "open"] },
    { url = "*.toml", use = ["edit", "open"] },
    { url = "*.sh", use = ["edit", "open"] },
    { url = "*.png", use = ["image", "open"] },
    { url = "*.jpg", use = ["image", "open"] },
    { url = "*.jpeg", use = ["image", "open"] },
    { url = "*.webp", use = ["image", "open"] },
    { url = "*.gif", use = ["image", "open"] },
]
