# ==============================================================================
# PICOM - PROFILE 2: DEEP ZOOM (CINEMATIC SCALE)
# ==============================================================================
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = false;
vsync = true;
xrender-sync-fence = true;

corner-radius = 9;
detect-rounded-corners = true;
detect-client-opacity = true;

rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'i3bar'",
    "class_g = 'Rofi'",
    "class_g = 'dmenu'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# --- Deep Zoom Physics ---
animations = true;
animation-stiffness-in-tag = 210.0;
animation-stiffness-tag-change = 200.0;
animation-window-mass = 0.7;
animation-dampening = 22.0;
animation-clamping = true;

animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";
animation-for-workspace-switch-in = "zoom";
animation-for-workspace-switch-out = "zoom";
animation-for-transient-window = "zoom";

animation-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'i3bar'",
    "class_g = 'Rofi'",
    "class_g = 'dmenu'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
    "!I3_FLOATING_WINDOW@:c = 1"
];

fading = false;
blur-method = "none";
blur-background = false;
active-opacity = 1.0;
inactive-opacity = 1.0;
