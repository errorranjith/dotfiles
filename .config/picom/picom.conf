# --- Backend & Performance ---
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
vsync = true;

# --- Corner Rounding & Smoothing ---
corner-radius = 10;

# Detect window shapes and rounded frames drawn by GTK/X11
detect-rounded-corners = true;
detect-client-opacity = true;

rounded-corners-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# --- Smooth Soft Shadows (Crucial for anti-aliasing curve edges) ---
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.40;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];
