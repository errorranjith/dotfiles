# Backend & VSync (Prevents video/browser screen tearing)
backend = "glx";
vsync = true;

# Subtle fading for clean transitions
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 5;

# No heavy blur, rounded corners, or sluggish animations
corner-radius = 0;
shadow = false;

# Rules
fade-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];
