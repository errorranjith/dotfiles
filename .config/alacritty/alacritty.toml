# window appearance
[window]
decorations = "none"
opacity = 0.90
padding = { x = 12, y = 12 }
dynamic_padding = true

# typography
[font]
size = 9.5

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

# monochrome color palette
[colors.primary]
background = "#000000"
foreground = "#d0d0d0"

[colors.cursor]
text = "#000000"
cursor = "#ffffff"

[colors.normal]
black   = "#1c1c1c"
red     = "#808080"
green   = "#a0a0a0"
yellow  = "#c0c0c0"
blue    = "#808080"
magenta = "#a0a0a0"
cyan    = "#d0d0d0"
white   = "#e5e5e5"

[colors.bright]
black   = "#404040"
red     = "#909090"
green   = "#b0b0b0"
yellow  = "#d8d8d8"
blue    = "#909090"
magenta = "#b0b0b0"
cyan    = "#e0e0e0"
white   = "#ffffff"

# cursor style
[cursor]
style = { shape = "Block", blinking = "Never" }
