[colors]
bg = #000000
fg = #ffffff
dim = #555555
line = #222222

[bar/main]
width = 100%
height = 22
bottom = true
fixed-center = true

background = ${colors.bg}
foreground = ${colors.fg}

border-top-size = 1
border-top-color = ${colors.line}

padding-left = 1
padding-right = 1
module-margin = 1

font-0 = JetBrains Mono:size=9;2

modules-left = i3
modules-right = pulseaudio battery date

cursor-click = pointer
cursor-scroll = ns-resize

tray-position = right
tray-padding = 2

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true

ws-icon-0 = 1;I
ws-icon-1 = 2;II
ws-icon-2 = 3;III
ws-icon-3 = 4;IV
ws-icon-4 = 5;V
ws-icon-5 = 6;VI
ws-icon-6 = 7;VII
ws-icon-7 = 8;VIII
ws-icon-8 = 9;IX
ws-icon-9 = 10;X
ws-icon-default = •

label-focused = " %icon% "
label-focused-foreground = ${colors.bg}
label-focused-background = ${colors.fg}

label-unfocused = " %icon% "
label-unfocused-foreground = ${colors.dim}

label-urgent = " %icon% "
label-urgent-foreground = ${colors.bg}
label-urgent-background = ${colors.fg}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = VOL %percentage%%
label-volume-foreground = ${colors.fg}
label-muted = MUTED
label-muted-foreground = ${colors.dim}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 5

format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>

label-charging = +%percentage%%
label-discharging = %percentage%%
label-full = 100%
label-foreground = ${colors.fg}

[module/date]
type = internal/date
interval = 1
date = %I:%M %p
label = %date%
label-foreground = ${colors.fg}
