[colors]
bg = #000000
fg = #ffffff
fg-dim = #737373
border = #262626

[bar/main]
width = 100%
height = 22pt
offset-x = 0.6%
offset-y = 6px
radius = 8

#override-redirect = false
wm-restack = i3

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2pt
border-size = 1pt
border-color = ${colors.border}

padding-left = 3
padding-right = 3
module-margin = 3

cursor-click = pointer
cursor-scroll = ns-resize

# Font 0: Compact text
font-0 = "Ubuntu Regular :style=Regular:size=9;2"

# Font 1: Dedicated icons (Nerd Font Symbols)
font-1 = "Symbols Nerd Font:style=Regular:size=10;3"

modules-left = xworkspaces
modules-center = date
modules-right = cpu memory pulseaudio battery wifi bluetooth copyq

# --- Workspaces ---

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-foreground = ${colors.fg}
label-active-underline = ${colors.fg}
label-active-padding = 2

label-occupied = %name%
label-occupied-foreground = ${colors.fg-dim}
label-occupied-padding = 2

label-urgent = %name%
label-urgent-foreground = ${colors.fg}
label-urgent-underline = ${colors.fg}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = #333333
label-empty-padding = 2

# --- Center Date ---

[module/date]
type = internal/date
interval = 1
date = "%a,  %b %d,  %I:%M"
label = %date%
label-foreground = ${colors.fg}

# --- System Modules with Explicit Icon Mapping ---

[module/cpu]
type = internal/cpu
interval = 1
format = <label>
format-prefix = "%{T2}󰍛%{T-} "
format-prefix-foreground = ${colors.fg-dim}
label = %percentage:2%%
label-foreground = ${colors.fg}

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = "%{T2}󰘚%{T-} "
format-prefix-foreground = ${colors.fg-dim}
label = %percentage_used%%
label-foreground = ${colors.fg}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 2

format-volume = <label-volume>
format-volume-prefix = "%{T2}󰕾%{T-} "
format-volume-prefix-foreground = ${colors.fg-dim}
label-volume = %percentage%%
label-volume-foreground = ${colors.fg}

format-muted = <label-muted>
format-muted-prefix = "%{T2}󰖁%{T-} "
format-muted-prefix-foreground = ${colors.fg-dim}
label-muted = "MUTED"
label-muted-foreground = ${colors.fg-dim}

click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
low-at = 20
poll-interval = 2

# Charging State
format-charging = <animation-charging> <label-charging>
label-charging = %percentage%%
label-charging-foreground = ${colors.fg}

animation-charging-0 = "%{T2}󰂆%{T-}"
animation-charging-1 = "%{T2}󰂈%{T-}"
animation-charging-2 = "%{T2}󰂊%{T-}"
animation-charging-3 = "%{T2}󰂅%{T-}"
animation-charging-foreground = ${colors.fg}
animation-charging-framerate = 750

# Discharging State
format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
label-discharging-foreground = ${colors.fg}

ramp-capacity-0 = "%{T2}󰁺%{T-}"
ramp-capacity-1 = "%{T2}󰁻%{T-}"
ramp-capacity-2 = "%{T2}󰁼%{T-}"
ramp-capacity-3 = "%{T2}󰁽%{T-}"
ramp-capacity-4 = "%{T2}󰁾%{T-}"
ramp-capacity-5 = "%{T2}󰁿%{T-}"
ramp-capacity-6 = "%{T2}󰂀%{T-}"
ramp-capacity-7 = "%{T2}󰂁%{T-}"
ramp-capacity-8 = "%{T2}󰂂%{T-}"
ramp-capacity-9 = "%{T2}󰁹%{T-}"
ramp-capacity-foreground = ${colors.fg-dim}

# Full State
format-full = <label-full>
format-full-prefix = "%{T2}󰁹%{T-} "
format-full-prefix-foreground = ${colors.fg}
label-full = %percentage%%
label-full-foreground = ${colors.fg}

# Low State
format-low = <animation-low> <label-low>
label-low = %percentage%%
label-low-foreground = ${colors.fg}
animation-low-0 = "%{T2}󰂃%{T-}"
animation-low-1 = " "
animation-low-foreground = ${colors.fg}
animation-low-framerate = 500

[module/wifi]
type = custom/script
exec = ~/.config/i3/scripts/polybar-wifi.sh
interval = 3
format = <label>
label = %output%
label-foreground = ${colors.fg}
# Left-click opens interactive Rofi menu; Right-click opens full network settings
click-left = ~/.config/i3/scripts/rofi-wifi.sh
click-right = nm-connection-editor

[module/bluetooth]
type = custom/script
exec = ~/.config/i3/scripts/polybar-bluetooth.sh
interval = 3
format = <label>
label = %output%
label-foreground = ${colors.fg}
# Left-click opens interactive Rofi device manager; Right-click opens Blueman if installed
click-left = ~/.config/i3/scripts/rofi-bluetooth.sh
click-right = blueman-manager

[module/copyq]
type = custom/text
content = "%{T2}󱉥%{T-}"
content-foreground = ${colors.fg-dim}
content-padding = 1
click-left = copyq toggle
