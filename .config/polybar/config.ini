[bar/main]
width = calc(100% - 16px)
height = 28pt
radius = 10
offset-x = 8px
offset-y = 8px

background = #000000
foreground = #ffffff

line-size = 2pt
border-size = 2pt
border-color = #262626

padding-left = 3
padding-right = 3
module-margin = 2

# Font 0: Primary text
font-0 = "JetBrainsMono Nerd Font:size=10;3"

# Font 1: Dedicated icon font with vertical baseline alignment
font-1 = "JetBrainsMono Nerd Font:size=11;3"

modules-left = xworkspaces
modules-center = date
modules-right = cpu memory pulseaudio wifi bluetooth copyq

[module/xworkspaces]
type = internal/xworkspaces
label-active = "[ %name% ]"
label-active-foreground = #ffffff
label-occupied = " %name% "
label-occupied-foreground = #737373
label-empty = " · "
label-empty-foreground = #262626

[module/date]
type = internal/date
interval = 1
date = "%A, %b %d  —  %H:%M"
label = %date%
label-foreground = #ffffff


# --- System Modules ---

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = #737373
format = <label>
label = %percentage%%
label-foreground = #ffffff

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰘚 "
format-prefix-foreground = #737373
format = <label>
label = %percentage_used%%
label-foreground = #ffffff

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

# Unmuted state
format-volume = <label-volume>
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = #737373
label-volume = %percentage%%
label-volume-foreground = #ffffff

# Muted state
format-muted = <label-muted>
format-muted-prefix = "󰖁 "
format-muted-prefix-foreground = #737373
label-muted = "MUTED"
label-muted-foreground = #737373

# Audio controls on click / scroll
click-right = pavucontrol

# --- Interactive Network & Tool Modules ---

[module/wifi]
type = custom/script
exec = ~/.config/i3/scripts/polybar-wifi.sh
interval = 5
format = <label>
label = %output%
label-foreground = #ffffff
click-left = ~/.config/i3/scripts/rofi-wifi.sh

[module/bluetooth]
type = custom/script
exec = ~/.config/i3/scripts/polybar-bluetooth.sh
interval = 5
format = <label>
label = %output%
label-foreground = #ffffff
click-left = ~/.config/i3/scripts/rofi-bluetooth.sh

[module/copyq]
type = custom/text
content = "󱉥"
content-foreground = #ffffff
content-padding = 1
click-left = copyq toggle
