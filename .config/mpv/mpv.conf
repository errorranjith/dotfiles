# ── Timeless · Monochrome MPV ──

# Video output and hardware decoding
vo=gpu
hwdec=auto-safe

# Lightweight playback
interpolation=no
video-sync=audio
vd-lavc-threads=0

# Playback
keep-open=yes
save-position-on-quit=yes
watch-later-options=start,vid,aid,sid
resume-playback=yes

# Minimal interface
osc=yes
osd-bar=no
osd-on-seek=msg
osd-duration=1200
osd-font="Ubuntu Regular"
osd-font-size=24
osd-color="#E6E6E6"
osd-border-color="#0D0D0D"
osd-border-size=2
osd-shadow-offset=0

# Subtitles
sub-auto=fuzzy
sub-font="JetBrains Mono"
sub-font-size=38
sub-color="#E6E6E6"
sub-border-color="#0D0D0D"
sub-border-size=2
sub-shadow-offset=0
sub-use-margins=yes

# Audio
volume=70
volume-max=100
audio-display=no

# Screenshots
screenshot-format=png
screenshot-png-compression=7
screenshot-directory="~/Pictures"

# YouTube / yt-dlp
ytdl=yes
ytdl-raw-options=ignore-config=
