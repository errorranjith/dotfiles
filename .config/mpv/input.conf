# Playback
SPACE cycle pause
p cycle pause
m cycle mute
q quit

# Seeking
RIGHT seek 5
LEFT seek -5
UP seek 60
DOWN seek -60
Shift+RIGHT seek 1
Shift+LEFT seek -1
Shift+UP seek 300
Shift+DOWN seek -300

# Volume
9 add volume -2
0 add volume 2
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2

# Display
f cycle fullscreen
s screenshot
v cycle sub
j cycle sub
J cycle sub down
Ctrl+h cycle audio
Ctrl+s screenshot each-frame

# Playback speed
[ add speed -0.1
] add speed 0.1
BS set speed 1.0

# Playlist
> playlist-next
< playlist-prev
ENTER cycle pause
