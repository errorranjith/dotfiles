font_family      monospace
font_size        11.0

# Spacing Tokens
window_border_width 0
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0

# Color Tokens
background           #000000
foreground           #ffffff
selection_background #ffffff
selection_foreground #000000
cursor               #ffffff
cursor_text_color    #000000

# ANSI Palette
color0   #000000
color8   #262626
color7   #737373
color15  #ffffff
color1   #ffffff
color2   #ffffff
color3   #ffffff
color4   #ffffff
color5   #ffffff
color6   #ffffff
