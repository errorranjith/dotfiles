# --- Typography ---
font_family      Ubuntu Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Window Layout & Padding ---
window_padding_width 20
confirm_os_window_close 0
hide_window_decorations yes
enable_audio_bell no
cursor_shape block
cursor_blink_interval 0

# --- Opacity & Compositing ---
background_opacity 0.88
dynamic_background_opacity no

# --- Monochrome Color Palette ---
background #000000
foreground #d0d0d0

cursor #ffffff
cursor_text_color #000000

selection_background #d0d0d0
selection_foreground #000000

# Black & Grayscale Normal Colors
color0 #1c1c1c
color1 #808080
color2 #a0a0a0
color3 #c0c0c0
color4 #808080
color5 #a0a0a0
color6 #d0d0d0
color7 #e5e5e5

# Bright Colors
color8  #404040
color9  #909090
color10 #b0b0b0
color11 #d8d8d8
color12 #909090
color13 #b0b0b0
color14 #e0e0e0
color15 #ffffff

allow_remote_control yes
listen_on unix:/tmp/kitty
enabled_layouts splits,stack
